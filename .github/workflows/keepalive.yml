# Modelo: copie para .github/workflows/keepalive.yml do repo público dumfinance/keepalive.
# Configure a variável de repositório APP_URL (domínio da Vercel). Nenhum segredo é usado.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" --retry 6 --retry-delay 15 --retry-all-errors --max-time 30 "${APP_URL}/api/health" || true)
          echo "status: ${code}"
          test "${code}" = "204"
